    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select, textarea, button {
      width: 100%; padding: 12px; margin-top: 6px;
      font-size: 15px; border-radius: 10px;
      border: 1px solid #e0e6f0; box-sizing: border-box;
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      margin-top: 16px; background: #2b6cb0; color: #fff;
      border: none; font-weight: 700; cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    small { display: block; margin-top: 10px; color: #666; font-size: 13px; }

  <script>
    const whatsappNumber = "5541998271309"; 

    function sendToWhatsApp() {
      const nome = document.getElementById("nome").value.trim();
      const musica = document.getElementById("musica").value;
      const mensagem = document.getElementById("mensagem").value.trim();

      if (!musica) {
        alert("Escolha uma música antes de enviar.");
        return false;
      }

      let texto = `🎶 Pedido de Música — Rock Vibzz\nMúsica: ${musica}\n`;
      if (nome) texto += `Nome: ${nome}\n`;
      if (mensagem) texto += `Recado: ${mensagem}\n`;
      texto += `\nEnviado pelo site do nosso acervo!`;

      const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(texto)}`;
      window.open(url, "_blank");

      return false;
    }
  </script>
